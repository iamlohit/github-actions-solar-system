name: Solar System Workflow

env:
  MONGO_URI: 'mongodb+srv://supercluster.d83jj.mongodb.net/superData'
  MONGO_USERNAME: 'superuser'
  MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}

on: 
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feature/*'
    
jobs:
    unit-testing:
        name: Unit Testing
        runs-on: ubuntu-latest
        container:
          image: node:20
        steps:
        - name: Checkout Repository
          uses: actions/checkout@v4

        # - name: Setup NodeJS Version
        #   uses: actions/setup-node@v4
        #   with:
        #     node-version: 20
        
        - name: Cache NPM dependencies
          uses: actions/cache@v4
          with:
            key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}
            path: ~/.npm

        - name: Install Dependencies
          run: npm install
    
        - name: Unit Testing
          run: npm test
          
        - name: Archive Test Result
          if: always()
          uses: actions/upload-artifact@v4
          with:
            name: Mocha-Test-Result
            path: test-results.xml
    code-coverage:
          name: code-coverage
          runs-on: ubuntu-latest
          continue-on-error: true
          steps:
          - name: Checkout Repository
            uses: actions/checkout@v4

          - name: Setup NodeJS Version
            uses: actions/setup-node@v4
            with:
              node-version: 18

          - name: Install Dependencies
            run: npm install
    
          - name: Run Code Coverage
            run: npm run coverage

          - name: Upload Code Coverage
            uses: actions/upload-artifact@v4
            if: always()
            with:
              name: Code-Coverage-Result
              path: coverage
              retention-days: 5
    docker:
      permissions:
        packages: write
      needs: [unit-testing, code-coverage]
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4
        - name: Login to GHCR
          uses: docker/login-action@v3
          with:
            registry: ghcr.io
            username: ${{ github.repository_owner }}
            password: ${{ secrets.GITHUB_TOKEN }}
        - name: Build and Push to GHCR
          uses: docker/build-push-action@v6
          with:
            push: true
            context: .
            tags: ghcr.io/${{ github.repository_owner }}/solar-system:${{ github.sha }}

    dev-deploy:
      runs-on: ubuntu-latest
      needs: [docker]
      environment: 
        name: development
      steps:
        - name: Checkout Repository
          uses: actions/checkout@v4
        - name: Install Kubectl
          uses: azure/setup-kubectl@v4
          with:
            version: v1.31.0
        - name: Setup K8s cluster config
          uses: azure/k8s-set-context@v4
          with:
            method: kubeconfig
            kubeconfig: ${{ secrets.KUBECONFIG }}
        - name: Verify Cluster connection
          continue-on-error: true
          run: kubectl version -o yaml
        - name: Fetch Nginx Ingress IP
          if: always()
          run: echo "INGRESS_IP=$(kubectl -n ingress-nginx get services ingress-nginx-controller -o jsonpath="{.status.loadBalancer.ingress[0].ip}")" >> $GITHUB_ENV
        - uses: cschleiden/replace-tokens@v1
          if: always()
          with:
            tokenPrefix: '_{_'
            tokenSuffix: '_}_'
            files: '["kubernetes/development/*.yaml"]'
          env:
            NAMESPACE: ${{ vars.NAMESPACE }}
            REPLICAS: ${{ vars.REPLICAS }}
            IMAGE: ghcr.io/${{ github.repository_owner }}/solar-system:${{ github.sha }}
            INGRESS_IP: ${{ env.INGRESS_IP }}
        - run: cat kubernetes/development/*.yaml
          if: always()
    integration-test:
      uses: ./.github/workflows/reusable-workflow.yml
